models:
  student:
    _target_: rdd.comparison.training.ComparisonWanModel
    init_from: /scr/yuheng/bugswarm/official_video_baselines_20261004/assets/Wan2.1-T2V-1.3B-Diffusers
    trainable: true
    attention_backend: FLASH_ATTN
    flow_shift: 1.0
    boundaries:
    - 0.0
    - 0.4
    - 0.7
    - 1.0
    comparison: pyramid_flow
method:
  _target_: rdd.comparison.training.ComparisonFineTuneMethod
  stage_probabilities:
  - 0.4
  - 0.3
  - 0.3
  teacher_weight: 0.0
  smoke_all_stages: true
  deadline_grace_seconds: 5.0
training:
  distributed:
    num_gpus: 1
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 1
  data:
    data_path: /scr/yuheng/bugswarm/official_video_baselines_20261004/fair_data/controlled_wan/train
    dataloader_num_workers: 1
    train_batch_size: 1
    training_cfg_rate: 0.1
    seed: 20261004
    num_latent_t: 3
    num_height: 128
    num_width: 256
    num_frames: 9
  optimizer:
    learning_rate: 1.0e-05
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.01
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 0
  loop:
    max_train_steps: 3
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: /scr/yuheng/bugswarm/official_video_baselines_20261004/runs/unified_fair_smoke/controlled/pyramid_flow
    training_state_checkpointing_steps: 0
    checkpoints_total_limit: 0
  tracker:
    trackers:
    - none
    project_name: ''
    run_name: openvid_wan_pyramid_flow
  model:
    enable_gradient_checkpointing_type: full
    weighting_scheme: uniform
    precondition_outputs: false
  dit_precision: fp32
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
pipeline:
  flow_shift: 1.0
