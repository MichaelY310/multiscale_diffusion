callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
method:
  _target_: rdd.finetune.RDDFineTuneMethod
  smoke_all_stages: true
  preview_every: 0
  deadline_grace_seconds: 5.0
models:
  student:
    _target_: rdd.finetune.RDDWanModel
    attention_backend: FLASH_ATTN
    boundaries:
    - 0.0
    - 0.4
    - 0.7
    - 1.0
    flow_shift: 1.0
    init_from: /scr/yuheng/bugswarm/official_video_baselines_20261004/assets/Wan2.1-T2V-1.3B-Diffusers
    trainable: true
pipeline:
  flow_shift: 1.0
training:
  checkpoint:
    checkpoints_total_limit: 0
    output_dir: /scr/yuheng/bugswarm/official_video_baselines_20261004/runs/unified_fair_smoke/native_rdd
    training_state_checkpointing_steps: 0
  data:
    data_path: /scr/yuheng/bugswarm/official_video_baselines_20261004/fair_data/controlled_wan/train
    dataloader_num_workers: 1
    num_frames: 9
    num_height: 128
    num_latent_t: 3
    num_width: 256
    seed: 20261004
    train_batch_size: 1
    training_cfg_rate: 0.1
  distributed:
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 1
    num_gpus: 1
    sp_size: 1
    tp_size: 1
  dit_precision: fp32
  loop:
    gradient_accumulation_steps: 1
    max_train_steps: 3
  model:
    enable_gradient_checkpointing_type: full
    precondition_outputs: false
    weighting_scheme: uniform
  optimizer:
    betas:
    - 0.9
    - 0.999
    learning_rate: 1.0e-05
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 0
    weight_decay: 0.01
  tracker:
    project_name: ''
    run_name: openvid_wan_rdd
    trackers:
    - none
